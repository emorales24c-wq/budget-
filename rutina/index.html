<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101413">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Libreta Rutina V7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: one-column gym logbook — sticky day switcher, exercise cards with set rows (lbs × reps), progress tab */
:root{
  --bg:#f3f4f2; --surface:#ffffff; --fg:#16191a; --muted:#5f6866; --line:#dde1de;
  --accent:#1f7a5c; --accent-ink:#ffffff; --accent-soft:#e1efe9; --warn:#a65a00; --warn-soft:#fbeedd;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101413; --surface:#181e1c; --fg:#e8ecea; --muted:#94a09c; --line:#29312e;
  --accent:#4cc495; --accent-ink:#0b1512; --accent-soft:#183128; --warn:#f0a94b; --warn-soft:#33261a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101413; --surface:#181e1c; --fg:#e8ecea; --muted:#94a09c; --line:#29312e;
  --accent:#4cc495; --accent-ink:#0b1512; --accent-soft:#183128; --warn:#f0a94b; --warn-soft:#33261a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto}
header{padding-block:20px 8px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;margin:4px 0 0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.status{font-size:13px;color:var(--muted);margin-top:6px;min-height:1.2em}
.status.warn{color:var(--warn)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;min-width:52px;font:700 17px var(--display);letter-spacing:.04em;text-transform:uppercase;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row label{font-size:13px;color:var(--muted)}
input{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.daytitle{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.03em;margin:18px 0 4px}
.daysub{color:var(--muted);font-size:13px;margin:0 0 12px}
.list{display:flex;flex-direction:column;gap:12px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.exhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.thumb{flex:0 0 auto;width:84px;height:56px;object-fit:cover;border-radius:6px;background:#000;cursor:zoom-in;transition:transform .15s}
.thumb.big{position:fixed;z-index:20;inset:0;margin:auto;width:min(92vw,520px);height:auto;max-height:80vh;object-fit:contain;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5);cursor:zoom-out}
.exhead .exname{flex:1}
.exname{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.1;text-transform:uppercase;letter-spacing:.02em;min-width:0}
.new{font:600 11px var(--body);letter-spacing:.08em;color:var(--accent);margin-left:6px;vertical-align:middle}
.target{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.last{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.last b{color:var(--fg);font-weight:600}
.tip{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;display:inline-block}
.tip.up{background:var(--accent-soft);color:var(--accent)}
.tip.rep{background:var(--warn-soft);color:var(--warn)}
.sets{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 8px;align-items:center}
.sets .h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sets .n{font:700 16px var(--display);color:var(--muted);width:44px}
.sets .n.f{color:var(--warn)}
.sets input{width:100%;min-width:0;text-align:center;font-variant-numeric:tabular-nums;font-size:17px;padding:9px 6px}
.prog{display:flex;flex-direction:column;gap:8px}
.pitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.pitem .exname{font-size:18px}
.pitem .nums{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.pitem .d{font-size:12px;font-weight:600}
.pitem .d.pos{color:var(--accent)} .pitem .d.zero{color:var(--muted)}
.pitem svg{grid-column:1/-1;width:100%;height:36px;display:block}
.empty{color:var(--muted);font-size:14px;padding:16px;border:1px dashed var(--line);border-radius:12px;text-align:center}
.foot{margin-top:22px;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
textarea{font:12px ui-monospace,monospace;width:100%;min-height:90px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px}
.backup{margin-top:20px;display:flex;flex-direction:column;gap:8px}
.backup .row button,.btn{font:600 14px var(--body);padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">Fase de definición · 28 oct → 20 dic</div>
    <h1>Libreta de pesos</h1>
    <div class="status" id="status">Cargando tus registros…</div>
  </header>

  <div class="bar">
    <div class="tabs" id="tabs" role="toolbar" aria-label="Día"></div>
    <div class="row" id="dateRow">
      <label for="date">Fecha</label>
      <input type="date" id="date">
    </div>
  </div>

  <main id="main"></main>
  <p class="foot">Regla de la fase: cada semana +1 rep o un poco más de peso. La serie en naranja va al fallo (o a 1 rep). Se guarda solo mientras escribes.</p>
</div>

const $ = s=>document.querySelector(s);
const today = ()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtDate = s=>{const [y,m,d]=s.split("-");return d+"/"+m};
let view = (()=>{const w=new Date().getDay();return w>=1&&w<=5?w-1:0})();
let date = today();
let sessions = {};   // id -> {date, day, ex:{key:[{w,r}]}}
let store = null;    // {save(id,obj)}
const pending = {}; let timers = {};

function sid(){return date+"_d"+(view+1)}
function cur(){return sessions[sid()] || {date, day:view+1, ex:{}}}

function lastFor(key, beforeDate){
  const list = Object.values(sessions).filter(s=>s.date<beforeDate && s.ex && s.ex[key] && s.ex[key].some(x=>x.w||x.r))
    .sort((a,b)=>a.date<b.date?1:-1);
  return list[0] ? {date:list[0].date, sets:list[0].ex[key]} : null;
}
function tipFor(last, rng){
  const done = last.sets.filter(x=>x.r);
  if(!done.length) return null;
  const allTop = done.length>=rng.s && done.slice(0,rng.s).every(x=>Number(x.r)>=rng.max);
  return allTop ? {c:"up",t:"Llegaste al tope: sube un poco el peso"} : {c:"rep",t:"Mismo peso, busca +1 rep"};
}
const setsTxt = sets=>sets.filter(x=>x.w||x.r).map(x=>(x.w||"–")+"×"+(x.r||"–")).join(" · ");

function renderTabs(){
  const t=$("#tabs"); t.innerHTML="";
  DAYS.forEach((d,i)=>{const b=document.createElement("button");b.type="button";b.id="tab"+i;b.textContent="Día "+(i+1);b.setAttribute("aria-pressed",i===view);
    b.onclick=()=>{view=i;renderTabs();render()};t.appendChild(b)});
  const p=document.createElement("button");p.type="button";p.id="tabP";p.textContent="Progreso";p.setAttribute("aria-pressed",view===5);
  p.onclick=()=>{view=5;renderTabs();render()};t.appendChild(p);
  $("#dateRow").hidden = view===5;
}

function render(){
  const m=$("#main"); m.innerHTML="";
  if(view===5) return renderProgress(m);
  const D=DAYS[view], s=cur();
  m.insertAdjacentHTML("beforeend",`<h2 class="daytitle">${D.t}</h2><p class="daysub">${D.sub} · ${fmtDate(date)}</p>`);
  const list=document.createElement("div");list.className="list";m.appendChild(list);
  D.ex.forEach(([key,rng,isNew],idx)=>{
    const sets = (s.ex[key]||[]);
    const last = lastFor(key,date);
    const tip = last && tipFor(last,rng);
    const card=document.createElement("section");card.className="ex";
    card.innerHTML=`<div class="exhead">${IMG[key]?`<img class="thumb" src="${IMG[key]}" alt="${EX[key].n}" loading="lazy" tabindex="0">`:""}<div class="exname">${EX[key].n}${isNew?'<span class="new">NUEVO V7</span>':''}</div>
      <div class="target">${rng.s}×${rng.min}–${rng.max}</div></div>
      <div class="last">${last?`Última vez (${fmtDate(last.date)}): <b>${setsTxt(last.sets)}</b>`:"Primera vez: apunta con cuánto empiezas"}</div>
      ${tip?`<div><span class="tip ${tip.c}">${tip.t}</span></div>`:""}`;
    const g=document.createElement("div");g.className="sets";
    g.innerHTML='<span class="h">Serie</span><span class="h">Libras</span><span class="h">Reps</span>';
    for(let i=0;i<rng.s;i++){
      const v=sets[i]||{}, lv=last&&last.sets[i]||{};
      const isFail = rng.fail && i===rng.s-1;
      const n=document.createElement("span");n.className="n"+(isFail?" f":"");n.textContent=(i+1)+(isFail?" ★":"");n.title=isFail?"Al fallo":"";
      g.appendChild(n);
      ["w","r"].forEach(f=>{
        const inp=document.createElement("input");inp.type="number";inp.inputMode="decimal";inp.min="0";inp.step=f==="w"?"2.5":"1";
        inp.id=`${view}-${idx}-${key}-${i}-${f}`;inp.value=v[f]??"";
        inp.placeholder=lv[f]!=null&&lv[f]!==""?String(lv[f]):(f==="w"?"lb":"reps");
        inp.setAttribute("aria-label",`${EX[key].n}, serie ${i+1}, ${f==="w"?"libras":"repeticiones"}`);
        inp.addEventListener("input",()=>edit(key,i,f,inp.value,rng.s));
        g.appendChild(inp);
      });
    }
    card.appendChild(g);list.appendChild(card);
  });
}

function edit(key,i,f,val,n){
  const id=sid();
  const s=JSON.parse(JSON.stringify(cur()));
  s.ex[key]=s.ex[key]||[];
  while(s.ex[key].length<n) s.ex[key].push({w:"",r:""});
  s.ex[key][i][f]= val===""?"":Number(val);
  s.updated=Date.now();
  sessions[id]=s;
  clearTimeout(timers[id]); setStatus("Guardando…");
  timers[id]=setTimeout(()=>flush(id),700);
}
async function flush(id){
  if(pending[id]){timers[id]=setTimeout(()=>flush(id),400);return}
  timers[id]=null; pending[id]=true;
  try{await store.save(id,sessions[id]); setStatus(store.note||"Guardado ✓")}
  catch(e){setStatus(e&&e.code==="quota_exceeded"?"No hay espacio para más registros.":"No se pudo guardar. Revisa tu conexión y vuelve a escribir.",true)}
  finally{pending[id]=false}
}
function setStatus(t,warn){const s=$("#status");s.textContent=t;s.classList.toggle("warn",!!warn)}

function bestOf(sets){let b=0;(sets||[]).forEach(x=>{if(Number(x.w)>b)b=Number(x.w)});return b}
function renderBackup(m){
  const b=document.createElement("section");b.className="backup";
  b.innerHTML=`<h2 class="daytitle">Respaldo</h2><p class="daysub">Tus registros viven en el teléfono. Copia el respaldo y guárdalo (notas, WhatsApp a ti mismo) por si desinstalas la app o cambias de teléfono.</p>
  <div class="row"><button type="button" class="btn primary" id="bkCopy">Copiar respaldo</button></div>
  <textarea id="bkText" placeholder="Pega aquí un respaldo para restaurarlo"></textarea>
  <div class="row"><button type="button" class="btn" id="bkLoad">Restaurar desde el texto</button><span class="last" id="bkMsg"></span></div>`;
  m.appendChild(b);
  const msg=t=>{b.querySelector("#bkMsg").textContent=t};
  b.querySelector("#bkCopy").onclick=async()=>{const txt=JSON.stringify(sessions);const ta=b.querySelector("#bkText");
    try{await navigator.clipboard.writeText(txt);msg("Copiado. Pégalo donde lo quieras guardar.")}catch(e){ta.value=txt;ta.select();msg("Selecciona el texto de arriba y cópialo.")}};
  b.querySelector("#bkLoad").onclick=()=>{try{const data=JSON.parse(b.querySelector("#bkText").value);
    if(!data||typeof data!=="object"||Array.isArray(data))throw 0;
    Object.assign(sessions,data);store.save();msg("Restaurado: "+Object.keys(data).length+" sesiones.");setTimeout(render,600)}catch(e){msg("Ese texto no es un respaldo válido.")}};
}
function renderProgress(m){
  m.insertAdjacentHTML("beforeend",`<h2 class="daytitle">Progreso</h2><p class="daysub">Peso más alto por sesión, del primer registro al último.</p>`);
  const per={};
  Object.values(sessions).forEach(s=>Object.entries(s.ex||{}).forEach(([k,sets])=>{const b=bestOf(sets);if(b){(per[k]=per[k]||[]).push({d:s.date,b})}}));
  const keys=Object.keys(EX).filter(k=>per[k]);
  if(!keys.length){m.insertAdjacentHTML("beforeend",`<div class="empty">Todavía no hay registros. Ve a tu día, apunta las libras de cada serie y aquí verás cómo suben.</div>`);renderBackup(m);return}
  const wrap=document.createElement("div");wrap.className="prog";m.appendChild(wrap);
  keys.forEach(k=>{
    const pts=per[k].sort((a,b)=>a.d<b.d?-1:1);
    const first=pts[0].b,lastv=pts[pts.length-1].b,diff=lastv-first;
    const el=document.createElement("div");el.className="pitem";
    let svg="";
    if(pts.length>1){
      const min=Math.min(...pts.map(p=>p.b)),max=Math.max(...pts.map(p=>p.b)),W=300,H=36,pad=4;
      const xy=pts.map((p,i)=>[pad+i*(W-2*pad)/(pts.length-1),max===min?H/2:H-pad-(p.b-min)*(H-2*pad)/(max-min)]);
      const d=xy.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
      const e=xy[xy.length-1];
      svg=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${e[0]}" cy="${e[1]}" r="3" fill="var(--accent)"/></svg>`;
    }
    el.innerHTML=`<div class="exname">${EX[k].n}</div><div class="nums">${lastv} lb</div>
      <div class="last">${pts.length} ${pts.length===1?"sesión":"sesiones"} · empezaste en ${first} lb</div>
      <div class="d ${diff>0?"pos":"zero"}">${diff>0?"+"+diff+" lb":"="}</div>${svg}`;
    wrap.appendChild(el);
  });
  renderBackup(m);
}

document.addEventListener("click",e=>{const t=e.target;document.querySelectorAll(".thumb.big").forEach(x=>{if(x!==t)x.classList.remove("big")});if(t.classList&&t.classList.contains("thumb"))t.classList.toggle("big")});
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelectorAll(".thumb.big").forEach(x=>x.classList.remove("big"));if(e.key==="Enter"&&e.target.classList.contains("thumb"))e.target.click()});
$("#date").value=date;
$("#date").addEventListener("change",e=>{if(e.target.value){date=e.target.value;render()}});
renderTabs(); render();

// ---- storage: private per-person db, with a local fallback ----
function localStore(note){
  try{const raw=localStorage.getItem("rutinaV7");if(raw)sessions=JSON.parse(raw)||{}}catch(e){}
  return {note,save:async(id,obj)=>{try{localStorage.setItem("rutinaV7",JSON.stringify(sessions))}catch(e){throw e}}};
}
store=localStore("Guardado en el teléfono ✓");
(()=>{const n=Object.keys(sessions).length;setStatus(n?`${n} ${n===1?"sesión guardada":"sesiones guardadas"} en el teléfono`:"Listo. Apunta tu primera sesión.");render()})();
if("serviceWorker" in navigator && location.protocol==="https:" && !/androidplatform/.test(location.host)){navigator.serviceWorker.register("sw.js").catch(()=>{})}
