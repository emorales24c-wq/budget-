name: Build Live Bets APK

on:
  push:
    paths:
      - "android/**"
      - "live-bets/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk LiveBets.apk

      # Fixed download link: .../releases/download/live-bets/LiveBets.apk
      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: live-bets
          name: Live Bets (Android)
          body: "Descarga LiveBets.apk desde tu teléfono e instálalo."
          files: LiveBets.apk
          make_latest: true
